[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paichecker"
version = "0.1.0"
description = "Detection and classification of misalignment between GitHub issues and pull requests (ASE'26)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "Jinja2",
    "litellm>=1.75.5",
    "pydantic>=2.0",
    "PyYAML",
    "rich",
    "tenacity",
    "typer",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paichecker = ["config/*.yaml"]
